{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="card login-card">
    <a class="back-link" href="{{ url_for(ROLES[g.user.role].endpoint) }}">← Back to dashboard</a>
    <h1>Change password</h1>
    <p class="muted">At least {{ min_length }} characters.</p>

    {% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}

    <form method="post" class="form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="text" name="username" value="{{ g.user.employee_id }}" autocomplete="username" hidden>
      <label for="current_password">Current password</label>
      <input id="current_password" name="current_password" type="password" required autofocus autocomplete="current-password">
      <label for="new_password">New password</label>
      <input id="new_password" name="new_password" type="password" required minlength="{{ min_length }}" autocomplete="new-password">
      <label for="confirm_password">Confirm new password</label>
      <input id="confirm_password" name="confirm_password" type="password" required minlength="{{ min_length }}" autocomplete="new-password">
      <button type="submit" class="btn btn-primary btn-block">Change password</button>
    </form>
  </div>
</div>
{% endblock %}
